<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Content Tracker · @marksvibez</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#1e293b;--muted:#94a3b8;--sub:#64748b;--line:#e8eef7;--blue:#3b82f6;--blue-deep:#2563eb;--blue-soft:#dbeafe;--teal:#14b8a6;--teal-soft:#ccfbf1;--radius:18px;--shadow:0 10px 30px rgba(37,99,235,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.handle{color:var(--blue-deep);font-weight:600;text-decoration:none}
.meta{color:var(--sub);font-size:13px;margin-top:4px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue-deep);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.2)}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:#fff;color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:#fff;color:#dc2626;border:1px solid #fecaca;box-shadow:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--blue-deep)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.stat{padding:16px 18px}
.stat .label{font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.stat .hint{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartcard{padding:16px 18px 10px;margin-bottom:26px}
.chartcard h2,.listhead h2{font-size:15px;margin:0 0 8px}
.chartbox{position:relative;height:170px}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.listhead h2{margin:0}
.controls{display:flex;gap:10px;align-items:center}
select{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text)}
.video{display:grid;grid-template-columns:112px 1fr;gap:18px;padding:18px;margin-bottom:14px;scroll-margin-top:16px}
.video.flash{outline:3px solid var(--blue-soft)}
.thumb{width:112px;aspect-ratio:9/16;border-radius:12px;background:var(--blue-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--blue);overflow:hidden}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.date{font-size:13px;color:var(--sub);font-weight:600}
.caption{margin:4px 0 8px;font-size:15px;font-weight:500;word-break:break-word}
.caption .tags{color:var(--muted);font-weight:400}
.links{display:flex;gap:14px;align-items:center;font-size:13px}
.links a{color:var(--blue-deep);font-weight:600;text-decoration:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pill{background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.pill b{font-weight:700}
.pill span{color:var(--sub);font-size:12px}
.pill.eng{background:var(--teal-soft);border-color:transparent}
.pill.eng span{color:#0f766e}
.hooks{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;display:grid;gap:2px}
.hook{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start;padding:5px 0}
.hook .k{font-size:13px;font-weight:600;color:var(--sub);padding-top:3px;white-space:nowrap}
.edit{min-height:30px;padding:4px 10px;border-radius:10px;outline:none;border:1px dashed transparent;cursor:text;word-break:break-word;font-size:14px}
.edit:hover{background:#f8fafc;border-color:var(--line)}
.edit:focus{background:#fff;border-color:var(--blue);border-style:solid;box-shadow:0 0 0 3px var(--blue-soft)}
.edit:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.auto{display:inline-block;margin-left:10px;font-size:11px;color:#0f766e;background:var(--teal-soft);border-radius:6px;padding:1px 7px;vertical-align:1px}
.hook.notes .k{color:var(--muted)}
.empty{text-align:center;color:var(--sub);padding:40px}
footer{margin-top:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
footer .tools{display:flex;gap:16px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:22px 22px 18px;box-shadow:0 30px 60px rgba(15,23,42,.2)}
.modal h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:600;color:var(--sub)}
.field input,.field textarea{font:inherit;font-size:14px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);width:100%}
.field textarea{resize:vertical;min-height:44px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.sep{font-size:12px;font-weight:700;color:var(--blue-deep);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 8px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.actions .right{display:flex;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{min-width:0}
@media (max-width:560px){
 .wrap{padding:22px 14px 50px}
 h1{font-size:23px}
 .video{grid-template-columns:80px 1fr;gap:12px;padding:14px}
 .thumb{width:80px}
 .pill{padding:4px 10px}
 .hook{grid-template-columns:1fr;gap:0}
 .grid{grid-template-columns:repeat(2,1fr)}
 .stat .value{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div>
   <h1>My Content Tracker</h1>
   <div class="meta"><a class="handle" href="https://www.tiktok.com/@marksvibez" target="_blank" rel="noopener">@marksvibez</a> · <span id="updated"></span></div>
  </div>
  <button class="btn" id="addBtn">+ Add video</button>
 </header>

 <section class="summary">
  <div class="card stat"><div class="label">Videos tracked</div><div class="value" id="sCount">—</div><div class="hint" id="sCountHint">&nbsp;</div></div>
  <div class="card stat"><div class="label">Total views</div><div class="value" id="sViews">—</div><div class="hint" id="sViewsHint">&nbsp;</div></div>
  <div class="card stat"><div class="label">Avg engagement</div><div class="value" id="sEng">—</div><div class="hint" title="(likes + comments + shares + saves) ÷ views, averaged across videos">interactions ÷ views</div></div>
  <div class="card stat"><div class="label">Best video</div><div class="value" id="sBest">—</div><div class="hint" id="sBestHint">&nbsp;</div></div>
 </section>

 <section class="card chartcard">
  <h2>Views per video</h2>
  <div class="chartbox"><canvas id="chart" aria-label="Views per video"></canvas></div>
 </section>

 <div class="listhead">
  <h2>Videos</h2>
  <div class="controls">
   <label for="sort" class="meta" style="margin:0">Sort</label>
   <select id="sort">
    <option value="newest">Newest</option>
    <option value="views">Most views</option>
    <option value="eng">Best engagement</option>
   </select>
  </div>
 </div>
 <div id="list"></div>

 <footer>
  <div>Hooks &amp; notes save in this browser automatically. Click any hook to type.</div>
  <div class="tools">
   <button class="linkbtn" id="exportBtn">Export CSV</button>
   <button class="linkbtn" id="importBtn">Import CSV</button>
   <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  </div>
 </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
 <form class="modal" id="form" autocomplete="off">
  <h3 id="formTitle">Add video</h3>
  <div class="field"><label for="fUrl">TikTok URL</label><input id="fUrl" type="url" placeholder="https://www.tiktok.com/@marksvibez/video/…"></div>
  <div class="grid">
   <div class="field" style="grid-column:span 2"><label for="fDate">Posted (date &amp; time)</label><input id="fDate" type="datetime-local"></div>
   <div class="field"><label for="fDur">Length (sec)</label><input id="fDur" type="number" min="0"></div>
  </div>
  <div class="field"><label for="fCap">Caption</label><textarea id="fCap" rows="2"></textarea></div>
  <div class="sep">Stats</div>
  <div class="grid">
   <div class="field"><label for="fViews">Views</label><input id="fViews" type="number" min="0"></div>
   <div class="field"><label for="fLikes">Likes</label><input id="fLikes" type="number" min="0"></div>
   <div class="field"><label for="fComments">Comments</label><input id="fComments" type="number" min="0"></div>
   <div class="field"><label for="fShares">Shares</label><input id="fShares" type="number" min="0"></div>
   <div class="field"><label for="fSaves">Saves</label><input id="fSaves" type="number" min="0"></div>
  </div>
  <div class="sep">Hooks</div>
  <div class="field"><label for="fVisual">👁 Visual hook</label><textarea id="fVisual" rows="2" placeholder="What's on screen in the first 2 seconds?"></textarea></div>
  <div class="field"><label for="fVocal">🎙 Vocal hook</label><textarea id="fVocal" rows="2" placeholder="First line you say"></textarea></div>
  <div class="field"><label for="fText">🔤 Text hook</label><textarea id="fText" rows="2" placeholder="On-screen text"></textarea></div>
  <div class="field"><label for="fNotes">📝 Notes</label><textarea id="fNotes" rows="2" placeholder="Anything worth remembering (optional)"></textarea></div>
  <div class="actions">
   <button type="button" class="btn danger" id="delBtn">Delete</button>
   <div class="right"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button type="submit" class="btn" id="saveBtn">Save</button></div>
  </div>
 </form>
</div>
<div class="toast" id="toast"></div>

const SEED_UPDATED = "2026-09-26T21:36:26-07:00";
const SEED_UPDATED_LABEL = "Sep 26, 2026, 9:36 pm PT";
const KEY = "marksvibez-content-tracker-v1";
const STAT_KEYS = ["views","likes","comments","shares","saves"];
const TZ = "America/Los_Angeles";

/* ---------- storage ---------- */
function load(){
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}
  if (!st || !Array.isArray(st.videos)) st = {videos:[], deleted:[], seed:null};
  const byId = new Map(st.videos.map(v => [v.id, v]));
  const deleted = new Set(st.deleted || []);
  for (const s of SEED) {
    if (deleted.has(s.id)) continue;
    const cur = byId.get(s.id);
    if (!cur) { st.videos.push({...s}); continue; }
    // refresh scraped stats unless you edited them by hand; never overwrite your hooks/notes
    if (!cur.statsEdited && st.seed !== SEED_UPDATED) {
      for (const k of [...STAT_KEYS, "duration", "caption", "posted", "url"]) cur[k] = s[k];
    }
    if (!cur.thumb && s.thumb) cur.thumb = s.thumb;
    if (!cur.vocal && s.vocal && !cur.vocalTouched) { cur.vocal = s.vocal; cur.vocalAuto = true; }
  }
  st.seed = SEED_UPDATED;
  return st;
}
let state = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Couldn't save in this browser (storage full or blocked)"); }
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = v => isNum(v) ? v.toLocaleString("en-US") : "—";
const compact = v => !isNum(v) ? "—" : v >= 1e6 ? (v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,"")+"M" : v >= 1e4 ? (v/1e3).toFixed(v>=1e5?0:1).replace(/\.0$/,"")+"K" : v.toLocaleString("en-US");
function engRate(v){
  if (!isNum(v.views) || v.views <= 0) return null;
  const parts = ["likes","comments","shares","saves"].map(k => v[k]).filter(isNum);
  if (!parts.length) return null;
  return parts.reduce((a,b)=>a+b,0) / v.views;
}
const pct = r => r == null ? "—" : (r*100).toFixed(r*100 >= 10 ? 1 : 2).replace(/\.?0+$/,"") + "%";
function fmtDate(iso, withTime=true){
  if (!iso) return "No date";
  const d = new Date(iso); if (isNaN(d)) return "No date";
  const o = {timeZone:TZ, weekday:"short", month:"short", day:"numeric"};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  if (withTime) { o.hour = "numeric"; o.minute = "2-digit"; }
  return d.toLocaleString("en-US", o) + (withTime ? " PT" : "");
}
function idFromUrl(u){ const m = String(u||"").match(/\/(?:video|photo)\/(\d{15,22})/); return m ? m[1] : null; }
function dateFromId(id){
  try { const s = Number(BigInt(id) >> 32n); if (s > 1.4e9 && s < 2.2e9) return new Date(s*1000).toISOString(); } catch(e) {}
  return null;
}
function captionHtml(c){
  if (!c) return '<span class="tags">No caption</span>';
  const tags = (c.match(/#[^\s#]+/g) || []).join(" ");
  const text = c.replace(/#[^\s#]+/g, "").replace(/\s+/g, " ").trim();
  return esc(text) + (tags ? ' <span class="tags">' + esc(tags) + '</span>' : "");
}
function shortCap(c, n=38){ const t = String(c||"").replace(/#[^\s#]+/g,"").trim() || "Untitled"; return t.length > n ? t.slice(0,n-1)+"…" : t; }
// convert ISO -> value for <input type=datetime-local> in PT, and back
function toLocalInput(iso){
  if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return "";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function fromLocalInput(val){
  if (!val) return "";
  // treat value as PT wall-clock time
  const guess = new Date(val + ":00Z");
  const off = ptOffsetMinutes(guess);
  return new Date(guess.getTime() - off*60000).toISOString();
}
function ptOffsetMinutes(d){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));
  const asUTC = Date.UTC(p.year, p.month-1, p.day, p.hour, p.minute, p.second);
  return Math.round((asUTC - d.getTime())/60000);
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200); }

/* ---------- render ---------- */
function sorted(){
  const vs = [...state.videos];
  const mode = $("sort").value;
  const t = v => new Date(v.posted || 0).getTime() || 0;
  if (mode === "views") vs.sort((a,b)=>(isNum(b.views)?b.views:-1)-(isNum(a.views)?a.views:-1) || t(b)-t(a));
  else if (mode === "eng") vs.sort((a,b)=>(engRate(b) ?? -1)-(engRate(a) ?? -1) || t(b)-t(a));
  else vs.sort((a,b)=>t(b)-t(a));
  return vs;
}
function renderSummary(){
  const vs = state.videos;
  $("sCount").textContent = vs.length;
  const dated = vs.map(v=>new Date(v.posted)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  const md = d => d.toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"});
  $("sCountHint").textContent = dated.length ? md(dated[0]) + " – " + md(dated[dated.length-1]) : " ";
  const withViews = vs.filter(v=>isNum(v.views));
  $("sViews").textContent = withViews.length ? compact(withViews.reduce((a,v)=>a+v.views,0)) : "—";
  $("sViewsHint").textContent = withViews.length ? "avg " + compact(Math.round(withViews.reduce((a,v)=>a+v.views,0)/withViews.length)) + " per video" : " ";
  const rates = vs.map(engRate).filter(r=>r!=null);
  $("sEng").textContent = rates.length ? pct(rates.reduce((a,b)=>a+b,0)/rates.length) : "—";
  const best = withViews.slice().sort((a,b)=>b.views-a.views)[0];
  if (best) {
    $("sBest").textContent = compact(best.views) + " views";
    $("sBestHint").innerHTML = '<a href="#v-' + esc(best.id) + '" class="handle" style="font-weight:500">' + esc(shortCap(best.caption)) + '</a>';
  } else { $("sBest").textContent = "—"; $("sBestHint").textContent = " "; }
}
let chart;
function renderChart(){
  const vs = state.videos.filter(v=>isNum(v.views)).sort((a,b)=>new Date(a.posted||0)-new Date(b.posted||0));
  const labels = vs.map(v => v.posted ? new Date(v.posted).toLocaleDateString("en-US",{timeZone:TZ,month:"numeric",day:"numeric"}) : "?");
  const data = vs.map(v => v.views);
  if (typeof Chart === "undefined") return;
  if (chart) { chart.data.labels = labels; chart.data.datasets[0].data = data; chart.$ids = vs.map(v=>v.id); chart.$vs = vs; chart.update(); return; }
  chart = new Chart($("chart"), {
    type: "bar",
    data: { labels, datasets: [{ data, backgroundColor: "#93c5fd", hoverBackgroundColor: "#2563eb", borderRadius: 6, maxBarThickness: 28, minBarLength: 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { displayColors:false, callbacks: {
        title: items => shortCap(chart.$vs[items[0].dataIndex].caption, 44),
        label: item => fmt(item.raw) + " views · " + fmtDate(chart.$vs[item.dataIndex].posted, false) } } },
      scales: { x: { grid: { display: false }, ticks: { color: "#94a3b8", font: { size: 11 }, maxRotation: 0, autoSkipPadding: 6 } },
                y: { beginAtZero: true, grid: { color: "#eef2f7" }, border: { display: false }, ticks: { color: "#94a3b8", font: { size: 11 }, maxTicksLimit: 4, callback: v => compact(v) } } },
      onClick: (e, els) => { if (els.length) jumpTo(chart.$ids[els[0].index]); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; }
    }
  });

}

  const el = document.getElementById("v-" + id); if (!el) return;

  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1400);
}

  return `<div class="hook${key==="notes"?" notes":""}"><div class="k">${icon} ${label}</div><div><div class="edit" contenteditable="true" spellcheck="true" data-id="${esc(v.id)}" data-key="${key}" data-ph="${esc(ph)}">${esc(v[key]||"")}</div>${auto}</div></div>`;

    return `<article class="card video" id="v-${esc(v.id)}">

        <div class="top"><div class="date">${esc(fmtDate(v.posted))}${isNum(v.duration) ? " · " + v.duration + "s" : ""}</div></div>
        <div class="caption">${captionHtml(v.caption)}</div>
        <div class="links">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">Watch on TikTok ↗</a>` : ""}<button class="linkbtn" data-edit="${esc(v.id)}">Edit</button></div>
      <div class="pills">
        <div class="pill"><b>${fmt(v.views)}</b><span>Views</span></div>
        <div class="pill"><b>${fmt(v.likes)}</b><span>Likes</span></div>
        <div class="pill"><b>${fmt(v.comments)}</b><span>Comments</span></div>
        <div class="pill"><b>${fmt(v.shares)}</b><span>Shares</span></div>
        <div class="pill"><b>${fmt(v.saves)}</b><span>Saves</span></div>
        <div class="pill eng"><b>${pct(r)}</b><span>Engagement</span></div>
      </div>
      </div>
      <div class="hooks" style="grid-column:1/-1">
        ${hookRow(v,"visual","👁","Visual","What's on screen in the first 2 seconds?")}
        ${hookRow(v,"vocal","🎙","Vocal","First line you say")}
        ${hookRow(v,"text","🔤","Text","On-screen text")}
        ${hookRow(v,"notes","📝","Notes","Notes (optional)")}
      </div>
    </article>`;
  }).join("");
}
function renderAll(){ renderSummary(); renderChart(); renderList(); }
$("updated").textContent = "Stats updated " + SEED_UPDATED_LABEL;

/* ---------- inline hook editing ---------- */
$("list").addEventListener("focusout", e => {
  const el = e.target.closest(".edit"); if (!el) return;
  const v = state.videos.find(x => x.id === el.dataset.id); if (!v) return;
  const key = el.dataset.key;
  const val = el.innerText.replace(/\u00a0/g," ").trim();
  if (!val) el.innerHTML = "";          // keep :empty placeholder working
  if ((v[key]||"") === val) return;
  v[key] = val;
  if (key === "vocal") { v.vocalAuto = false; v.vocalTouched = true; const tag = el.parentElement.querySelector(".auto"); if (tag) tag.remove(); }
  save(); toast("Saved");
});
$("list").addEventListener("keydown", e => {
  const el = e.target.closest(".edit"); if (!el) return;
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); el.blur(); }
  if (e.key === "Escape") { el.blur(); }
});
$("list").addEventListener("paste", e => {
  const el = e.target.closest(".edit"); if (!el) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-edit]"); if (b) openForm(b.dataset.edit);
});
$("sort").addEventListener("change", renderList);
$("sBestHint").addEventListener("click", e => { const a = e.target.closest("a"); if (a) { e.preventDefault(); jumpTo(a.getAttribute("href").slice(3)); } });

/* ---------- modal ---------- */
let editing = null;
const F = {url:"fUrl", caption:"fCap", duration:"fDur", views:"fViews", likes:"fLikes", comments:"fComments", shares:"fShares", saves:"fSaves", visual:"fVisual", vocal:"fVocal", text:"fText", notes:"fNotes"};
function openForm(id){
  editing = id ? state.videos.find(v => v.id === id) : null;
  $("formTitle").textContent = editing ? "Edit video" : "Add video";
  $("delBtn").style.visibility = editing ? "visible" : "hidden";
  for (const [k, fid] of Object.entries(F)) $(fid).value = editing && editing[k] != null ? editing[k] : "";
  $("fDate").value = editing ? toLocalInput(editing.posted) : "";
  $("overlay").classList.add("open");
  setTimeout(()=>$(editing ? "fViews" : "fUrl").focus(), 30);
}
function closeForm(){ $("overlay").classList.remove("open"); editing = null; }
$("addBtn").addEventListener("click", () => openForm(null));
$("cancelBtn").addEventListener("click", closeForm);
$("overlay").addEventListener("mousedown", e => { if (e.target === $("overlay")) closeForm(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("open")) closeForm(); });
$("fUrl").addEventListener("input", () => {
  const id = idFromUrl($("fUrl").value);
  if (id && !$("fDate").value) { const iso = dateFromId(id); if (iso) $("fDate").value = toLocalInput(iso); }
});
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const num = fid => { const s = $(fid).value.trim(); if (s === "") return null; const n = Number(s); return isFinite(n) ? n : null; };
  const url = $("fUrl").value.trim();
  const vals = {
    url, caption: $("fCap").value.trim(), posted: fromLocalInput($("fDate").value), duration: num("fDur"),
    views: num("fViews"), likes: num("fLikes"), comments: num("fComments"), shares: num("fShares"), saves: num("fSaves"),
    visual: $("fVisual").value.trim(), vocal: $("fVocal").value.trim(), text: $("fText").value.trim(), notes: $("fNotes").value.trim()
  };
  if (!url && !vals.caption) { toast("Add a URL or caption first"); $("fUrl").focus(); return; }
  if (editing) {
    const statsChanged = [...STAT_KEYS, "duration", "caption", "posted", "url"].some(k => (editing[k] ?? null) !== (vals[k] === "" && editing[k] == null ? null : vals[k]));
    if (statsChanged) editing.statsEdited = true;
    if ((editing.vocal||"") !== vals.vocal) { editing.vocalAuto = false; editing.vocalTouched = true; }
    Object.assign(editing, vals);
    toast("Video updated");
  } else {
    const id = idFromUrl(url) || ("manual-" + Date.now());
    if (state.videos.some(v => v.id === id)) { toast("That video is already in your tracker"); return; }
    state.videos.push({ id, thumb: "", vocalAuto: false, statsEdited: true, ...vals });
    state.deleted = (state.deleted||[]).filter(x => x !== id);
    toast("Video added");
  }
  save(); closeForm(); renderAll();
});
$("delBtn").addEventListener("click", () => {
  if (!editing || !confirm("Remove this video from your tracker?")) return;
  state.videos = state.videos.filter(v => v !== editing);
  state.deleted = [...new Set([...(state.deleted||[]), editing.id])];
  save(); closeForm(); renderAll(); toast("Removed");
});

/* ---------- CSV ---------- */
const COLS = ["id","url","posted_pt","caption","duration_sec","views","likes","comments","shares","saves","engagement_pct","visual_hook","vocal_hook","text_hook","notes"];
function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function exportCSV(){
  const rows = [COLS.join(",")];
  for (const v of sorted()) {
    const r = engRate(v);
    rows.push([v.id, v.url, toLocalInput(v.posted).replace("T"," "), v.caption, v.duration, v.views, v.likes, v.comments, v.shares, v.saves,
      r == null ? "" : (r*100).toFixed(2), v.visual, v.vocal, v.text, v.notes].map(csvCell).join(","));
  }
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "marksvibez-content-" + toLocalInput(new Date().toISOString()).slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast("CSV exported");
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function importCSV(text){
  const rows = parseCSV(text); if (rows.length < 2) { toast("No rows found in that CSV"); return; }
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = name => head.indexOf(name);
  const get = (r, name) => { const i = col(name); return i < 0 ? undefined : (r[i] ?? "").trim(); };
  const numOrNull = s => { if (s === undefined) return undefined; if (s === "") return null; const n = Number(s.replace(/,/g,"")); return isFinite(n) ? n : null; };
  let added = 0, updated = 0;
  for (const r of rows.slice(1)) {
    const url = get(r,"url") || "";
    const id = get(r,"id") || idFromUrl(url) || ("manual-" + Date.now() + "-" + Math.random().toString(36).slice(2,6));
    let v = state.videos.find(x => x.id === id);
    const isNew = !v;
    if (isNew) { v = { id, thumb: "", vocalAuto: false, statsEdited: true, visual:"", vocal:"", text:"", notes:"" }; state.videos.push(v); }
    const posted = get(r,"posted_pt");
    const vals = { url, caption: get(r,"caption"), posted: posted ? fromLocalInput(posted.replace(" ","T").slice(0,16)) : (isNew ? dateFromId(id) || "" : undefined),
      duration: numOrNull(get(r,"duration_sec")), views: numOrNull(get(r,"views")), likes: numOrNull(get(r,"likes")), comments: numOrNull(get(r,"comments")),
      shares: numOrNull(get(r,"shares")), saves: numOrNull(get(r,"saves")),
      visual: get(r,"visual_hook"), vocal: get(r,"vocal_hook"), text: get(r,"text_hook"), notes: get(r,"notes") };
    if (!isNew && vals.vocal !== undefined && vals.vocal !== (v.vocal||"")) { v.vocalAuto = false; v.vocalTouched = true; }
    if (!isNew && [...STAT_KEYS].some(k => vals[k] !== undefined && vals[k] !== (v[k] ?? null))) v.statsEdited = true;
    for (const [k, val] of Object.entries(vals)) if (val !== undefined && !(k === "url" && !val && v.url)) v[k] = val;
    state.deleted = (state.deleted||[]).filter(x => x !== id);
    isNew ? added++ : updated++;
  }
  save(); renderAll(); toast(`Imported: ${added} new, ${updated} updated`);
}
$("exportBtn").addEventListener("click", exportCSV);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { importCSV(String(rd.result)); e.target.value = ""; }; rd.readAsText(f);
});

renderAll();
</script>
