<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook breakdown · @marksvibez</title>
<style>
:root{--cyan:#25F4EE;--pink:#FE2C55;--bg:#0b0b10;--card:#16161f;--card1:#1b1b27;--line:#262634;--muted:#9a9ab0;--dim:#6f6f84;--txt:#f3f3f7;--body:#dcdce6;
 --lab:150px;--gap:18px;--col:max(262px, calc((min(100vw, 1240px) - 48px - var(--lab) - 3 * var(--gap) - 14px) / 3))}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--txt);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif,"Apple Color Emoji","Noto Color Emoji";font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
 background:radial-gradient(1100px 560px at 8% -12%,rgba(37,244,238,.07),transparent 60%),radial-gradient(1000px 620px at 100% -4%,rgba(254,44,85,.13),transparent 62%),radial-gradient(900px 700px at 50% 120%,rgba(120,20,40,.10),transparent 65%),var(--bg);background-attachment:fixed}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 40px}
button,select,input,textarea{font:inherit;color:inherit}
/* header */
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:8px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
h1 .dash{color:var(--muted);font-weight:400}
.grad{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:8px;font-size:15px;color:var(--muted)}
/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.7fr);gap:12px;margin:24px 0 18px}
.sbox{background:rgba(22,22,31,.85);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:0}
.sbox .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sbox .v{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .h{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .h a{color:var(--cyan);text-decoration:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:6px}
.bars button{flex:1;min-width:3px;border:0;padding:0;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,rgba(37,244,238,.75),rgba(37,244,238,.25));cursor:pointer}
.bars button:hover,.bars button.r1{background:linear-gradient(180deg,var(--cyan),var(--pink))}
/* toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:10px}
.tl label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select{background:#16161f;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;color:var(--txt)}
.nav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#16161f;cursor:pointer;font-size:16px;line-height:1}
.nav:hover{border-color:#3a3a4c}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0b0b10}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#222230;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#ff8aa0;border:1px solid rgba(254,44,85,.35)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--cyan)}
/* grid */
.scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-left:calc(var(--lab) + var(--gap));padding-bottom:14px;scrollbar-color:#33334a transparent;scrollbar-width:thin}
.scroller::-webkit-scrollbar{height:8px}.scroller::-webkit-scrollbar-thumb{background:#2c2c3e;border-radius:9px}
.grid{display:grid;grid-template-columns:var(--lab) repeat(var(--n),var(--col));grid-template-rows:repeat(10,auto);column-gap:var(--gap);width:max-content;padding-right:4px}
.labels{grid-column:1;grid-row:1/-1;display:grid;grid-template-rows:subgrid;position:sticky;left:0;z-index:4;transition:background .15s,box-shadow .15s}
.scroller.scrolled .labels{background:#0d0c12;box-shadow:14px 0 18px -10px rgba(0,0,0,.85)}
.lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:20px 8px 0 0;border-top:1px solid transparent}
.col{grid-row:1/-1;display:grid;grid-template-rows:subgrid;border-radius:22px;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(#1c1c27,#1c1c27) border-box;scroll-snap-align:start;min-width:0}
.col.r1{background:linear-gradient(var(--card1),var(--card1)) padding-box,linear-gradient(90deg,rgba(37,244,238,.6),rgba(160,150,170,.35) 50%,rgba(254,44,85,.6)) border-box}
.col.flash{animation:flash 1.3s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px rgba(37,244,238,.45)}}
.cell{padding:16px 20px;border-top:1px solid var(--line);min-width:0;word-break:break-word}
.cell.top{border-top:0;padding-top:20px}
.cell.bottom{padding-bottom:20px}
/* thumb */
.thumb{position:relative;display:block;width:74%;max-width:250px;margin:0 auto;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#101018 center/cover no-repeat;box-shadow:0 14px 34px rgba(0,0,0,.55);text-decoration:none;color:var(--muted)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.chip{position:absolute;top:10px;left:10px;font-weight:800;font-size:14px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.7);border:2px solid #777;color:#ccc}
.chip.r1{background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0b0b10;border:0;padding:5px 12px}
.chip.good{border-color:var(--cyan);color:var(--cyan)}
.play{position:absolute;bottom:10px;right:10px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
/* content */
.vtitle{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
.product{margin-top:5px;font-size:13.5px;color:var(--cyan);font-weight:600}
.product::before{content:"🛍️ "}
.product.ed:empty::before{font-style:normal}
.vlinks{margin-top:8px;display:flex;gap:12px;align-items:center;font-size:12px}
.vlinks a{color:var(--muted);text-decoration:none}.vlinks a:hover{color:var(--cyan)}
.body{font-size:14px;line-height:1.5;color:var(--body)}
.quote{font-size:14.5px;line-height:1.5;font-style:italic;color:#fff;border-left:3px solid var(--pink);padding-left:12px}
.quote:not(:empty)::before{content:"“"}.quote:not(:empty)::after{content:"”"}
.after{margin-top:8px;font-size:13px;color:var(--body);padding-left:15px}
.after q{font-style:italic;color:var(--cyan);quotes:"“" "”"}
.after .t{font-style:italic;color:var(--cyan)}
.auto{display:inline-block;margin:8px 0 0 15px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--cyan);border:1px solid rgba(37,244,238,.3);border-radius:6px;padding:0 6px}
.overlay{display:inline-block;max-width:100%;font-size:14px;font-weight:700;background:#fff;color:#111;padding:7px 12px;border-radius:9px;line-height:1.35}
.overlay:not(:empty)::before{content:"“"}.overlay:not(:empty)::after{content:"”"}
.overlay:empty{background:transparent;border:1px dashed #3a3a4c;font-weight:500}
.barrow{display:flex;align-items:center;gap:12px;margin-top:13px}
.bar{flex:1;height:9px;background:#2a2a38;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:999px}
.barlbl{font-weight:800;font-size:15px;min-width:26px;text-align:right}
.barcap{margin-top:4px;font-size:11px;color:var(--muted)}
.cq:not(:empty)::before{content:"“"}.cq:not(:empty)::after{content:"”"}
.stats{display:flex;gap:28px;align-items:flex-start}
.num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.lbl{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.35}
.lbl span{font-size:11px;color:var(--dim)}
.mini{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;padding-top:10px;border-top:1px dashed #2a2a3a;font-size:11.5px;color:var(--dim)}
.mini b{color:var(--body);font-weight:700;font-size:12.5px;margin-right:3px}
.mini .e b{color:var(--cyan)}
.tag{display:inline-block;max-width:100%;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;line-height:1.35;background:rgba(154,154,176,.08);color:#cfcfdc;border:1px solid rgba(154,154,176,.3)}
.tag.strong{background:rgba(37,244,238,.10);color:var(--cyan);border-color:rgba(37,244,238,.35)}
.tag.weak{background:rgba(254,44,85,.10);color:#ff8aa0;border-color:rgba(254,44,85,.35)}
.tag:empty{background:transparent;border:1px dashed #3a3a4c;color:var(--dim)}
.note{font-size:12.5px;color:var(--muted)}
.badge{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:#222230;border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.badge .bnum{font-size:24px;font-weight:900;color:#cfcfdc}
.badge .btxt{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt)}
.badge.good .bnum{color:var(--cyan)}
.badge.weak .bnum{color:var(--pink)}.badge.weak .btxt{color:#bbb}
.badge.auto .btxt{color:var(--muted);font-size:11.5px}
.badge.r1{background:linear-gradient(90deg,var(--cyan),var(--pink));border-color:transparent}
.badge.r1 .bnum,.badge.r1 .btxt{color:#0b0b10}
/* inline edit */
.ed{outline:none;border-radius:6px;cursor:text;transition:box-shadow .12s}
.ed:hover{box-shadow:0 0 0 4px rgba(255,255,255,.035),0 0 0 5px rgba(255,255,255,.06)}
.ed:focus{box-shadow:0 0 0 4px rgba(37,244,238,.08),0 0 0 5px rgba(37,244,238,.45)}
.ed:empty::before{content:attr(data-ph);color:var(--dim);font-style:italic;font-weight:500}
.quote:empty::before,.cq:empty::before,.overlay:empty::before,.tag:empty::before,.note:empty::before{content:attr(data-ph);color:var(--dim);font-style:italic;font-weight:500}
.tag:empty::before{font-style:normal}
.quote.ed{border-radius:0 6px 6px 0}.tag.ed{border-radius:999px}.overlay.ed{border-radius:9px}
/* footer */
footer{margin-top:18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer .n{display:flex;gap:10px;align-items:center}
footer .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:none}
footer .tools{display:flex;gap:16px}
/* modal */
.overlayBg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:50}
.overlayBg.open{display:flex}
.modal{background:#14141c;border:1px solid var(--line);border-radius:20px;width:100%;max-width:620px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal h3{margin:0 0 14px;font-size:19px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.field input,.field textarea,.field select{font-size:14px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0e0e14;color:var(--txt);width:100%}
.field textarea{resize:vertical;min-height:42px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:rgba(37,244,238,.6);box-shadow:0 0 0 3px rgba(37,244,238,.12)}
.sep{font-size:11px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.14em;margin:12px 0 8px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.actions .r{display:flex;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f3f3f7;color:#0b0b10;font-weight:600;padding:9px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media (max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary .chartbox{grid-column:1/-1}}
@media (max-width:640px){
 :root{--lab:76px;--gap:12px;--col:calc(100vw - var(--lab) - 78px)}
 .wrap{padding:26px 14px 36px}
 h1{font-size:25px}
 .sub{font-size:13.5px}
 .lab{font-size:9.5px;letter-spacing:.05em;padding-top:16px}
 .cell{padding:14px 15px}
 .vtitle{font-size:17px}
 .num{font-size:25px}
 .stats{gap:20px}
 .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .nav{display:none}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="kicker">TikTok content · hook comparison</div>
  <h1>Hook breakdown <span class="dash">—</span> <a class="grad" href="https://www.tiktok.com/@marksvibez" target="_blank" rel="noopener" style="text-decoration:none">@marksvibez</a></h1>
  <div class="sub" id="sub"></div>
 </header>

 <section class="summary">
  <div class="sbox"><div class="l">Videos tracked</div><div class="v" id="sCount">—</div><div class="h" id="sCountH">&nbsp;</div></div>
  <div class="sbox"><div class="l">Total views</div><div class="v" id="sViews">—</div><div class="h" id="sViewsH">&nbsp;</div></div>
  <div class="sbox"><div class="l">Avg engagement</div><div class="v" id="sEng">—</div><div class="h" title="(likes + comments + shares + saves) ÷ views, averaged across videos">interactions ÷ views</div></div>
  <div class="sbox"><div class="l">Best video</div><div class="v" id="sBest">—</div><div class="h" id="sBestH">&nbsp;</div></div>
  <div class="sbox chartbox"><div class="l">Views per video <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim)">· oldest → newest, tap a bar</span></div><div class="bars" id="bars"></div></div>
 </section>

 <div class="toolbar">
  <div class="tl">
   <label for="sort">Sort</label>
   <select id="sort">
    <option value="rank">Rank</option>
    <option value="newest">Newest</option>
    <option value="views">Most views</option>
    <option value="eng">Best engagement</option>
   </select>
   <button class="nav" id="prev" aria-label="Scroll left">‹</button><button class="nav" id="next" aria-label="Scroll right">›</button>
  </div>
  <button class="btn" id="addBtn">+ Add video</button>
 </div>

 <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>

 <footer>
  <div class="n"><span class="dot"></span><span id="footNote"></span></div>
  <div class="tools">
   <button class="linkbtn" id="exportBtn">Export CSV</button>
   <button class="linkbtn" id="importBtn">Import CSV</button>
   <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  </div>
 </footer>
</div>

<div class="overlayBg" id="overlay" role="dialog" aria-modal="true">
 <form class="modal" id="form" autocomplete="off">
  <h3 id="formTitle">Add video</h3>
  <div class="field"><label for="fUrl">TikTok URL</label><input id="fUrl" type="url" placeholder="https://www.tiktok.com/@marksvibez/video/…"></div>
  <div class="g3">
   <div class="field" style="grid-column:span 2"><label for="fDate">Posted (PT)</label><input id="fDate" type="datetime-local"></div>
   <div class="field"><label for="fDur">Length (sec)</label><input id="fDur" type="number" min="0"></div>
  </div>
  <div class="field"><label for="fCap">Caption</label><textarea id="fCap" rows="2"></textarea></div>
  <div class="field"><label for="fProduct">🛍️ Product</label><input id="fProduct" placeholder="e.g. Superficial card game"></div>
  <div class="sep">Stats</div>
  <div class="g3">
   <div class="field"><label for="fViews">Views</label><input id="fViews" type="number" min="0"></div>
   <div class="field"><label for="fLikes">Likes</label><input id="fLikes" type="number" min="0"></div>
   <div class="field"><label for="fComments">Comments</label><input id="fComments" type="number" min="0"></div>
   <div class="field"><label for="fShares">Shares</label><input id="fShares" type="number" min="0"></div>
   <div class="field"><label for="fSaves">Saves</label><input id="fSaves" type="number" min="0"></div>
  </div>
  <div class="sep">Hooks</div>
  <div class="field"><label for="fVisual">👀 Visual hook</label><textarea id="fVisual" rows="2" placeholder="What's on screen in the first 2 seconds?"></textarea></div>
  <div class="field"><label for="fVocal">🎙️ Vocal hook</label><textarea id="fVocal" rows="2" placeholder="First line you say"></textarea></div>
  <div class="field"><label for="fVocalNote">🎙️ Vocal hook — second line (optional)</label><input id="fVocalNote" placeholder='e.g. AI glitches: "Al, al, f-o-h-m, brah"'></div>
  <div class="g3">
   <div class="field" style="grid-column:span 2"><label for="fText">💬 Text hook</label><input id="fText" placeholder="On-screen text"></div>
   <div class="field"><label for="fTextSec">On screen (sec, of ~7)</label><input id="fTextSec" type="number" min="0" max="60" step="0.5"></div>
  </div>
  <div class="field"><label for="fCta">👉 CTA</label><input id="fCta" placeholder="What you tell people to do"></div>
  <div class="sep">Verdict</div>
  <div class="g3">
   <div class="field" style="grid-column:span 2"><label for="fStyle">🎭 Hook style</label><input id="fStyle" placeholder="e.g. Comedy skit — product is part of the joke"></div>
   <div class="field"><label for="fTone">Style strength</label><select id="fTone"><option value="">—</option><option value="strong">Strong</option><option value="neutral">Neutral</option><option value="weak">Weak</option></select></div>
   <div class="field"><label for="fRank">🏆 Your rank</label><input id="fRank" type="number" min="1" step="1" placeholder="blank = by views"></div>
   <div class="field" style="grid-column:span 2"><label for="fRankLabel">Rank label</label><input id="fRankLabel" placeholder="e.g. Strongest / Solid / Weakest"></div>
  </div>
  <div class="field"><label for="fNotes">📝 Notes</label><textarea id="fNotes" rows="2" placeholder="Anything worth remembering (optional)"></textarea></div>
  <div class="actions">
   <button type="button" class="btn danger" id="delBtn">Delete</button>
   <div class="r"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button type="submit" class="btn" id="saveBtn">Save</button></div>
  </div>
 </form>
</div>

function blank(id){ const v = {id, url:"", posted:"", caption:"", duration:null, thumb:"", vocalAuto:false, statsEdited:true, touched:{}}; STAT_KEYS.forEach(k=>v[k]=null); HOOK_KEYS.forEach(k=>v[k]=(k==="textHookSeconds"||k==="rank")?null:""); return v; }
function load(){
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}
  const fresh = !st || !Array.isArray(st.videos);
  if (fresh) st = {videos:[], deleted:[]};
  const byId = new Map(st.videos.map(v => [v.id, v]));
  const deleted = new Set(st.deleted || []);
  for (const s of SEED) {
    if (deleted.has(s.id)) continue;
    let cur = byId.get(s.id);
    if (!cur) { cur = {...s, touched:{}, statsEdited:false}; st.videos.push(cur); byId.set(s.id, cur); continue; }
    cur.touched = cur.touched || {};
    if (!cur.statsEdited) for (const k of [...STAT_KEYS, ...META_KEYS]) cur[k] = s[k];
    for (const k of HOOK_KEYS) if (!cur.touched[k]) cur[k] = s[k];
    if (!cur.touched.vocal) cur.vocalAuto = s.vocalAuto;
    if (s.thumb) cur.thumb = s.thumb;
  }
  // one-time: bring over anything typed in the previous (v1) tracker
  if (fresh) {
    let old = null; try { old = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); } catch(e) {}
    if (old && Array.isArray(old.videos)) {
      for (const d of old.deleted || []) if (!byId.has(d)) st.deleted.push(d);
      for (const o of old.videos) {
        let cur = byId.get(o.id);
        if (!cur) { if ((old.deleted||[]).includes(o.id)) continue; cur = blank(o.id); for (const k of [...STAT_KEYS, ...META_KEYS, "thumb"]) if (o[k] != null) cur[k] = o[k]; st.videos.push(cur); byId.set(o.id, cur); }
        for (const k of ["visual","text","notes","vocal"]) {
          if (k === "vocal" && !o.vocalTouched) continue;
          if (o[k] && !cur[k]) { cur[k] = o[k]; cur.touched[k] = true; if (k === "vocal") cur.vocalAuto = false; }
        }
        if (o.statsEdited && SEED.some(s => s.id === o.id)) { for (const k of STAT_KEYS) if (o[k] != null) cur[k] = o[k]; cur.statsEdited = true; }
      }
    }
  }
  return st;
}

function engRate(v){
  if (!isNum(v.views) || v.views <= 0) return null;
  const parts = ["likes","comments","shares","saves"].map(k => v[k]).filter(isNum);

function ptOffsetMinutes(d){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));

/* ---------- ranking: your rating first, then views ---------- */
function computeRanks(){
  const vs = state.videos;
  const manual = vs.filter(v => isNum(v.rank)).sort((a,b)=>a.rank-b.rank);
  const maxManual = manual.length ? Math.max(...manual.map(v=>v.rank)) : 0;
  const rest = vs.filter(v => !isNum(v.rank)).sort((a,b)=>(isNum(b.views)?b.views:-1)-(isNum(a.views)?a.views:-1) || new Date(b.posted||0)-new Date(a.posted||0));
  const out = new Map();
  manual.forEach(v => out.set(v.id, {n:v.rank, manual:true}));
  rest.forEach((v,i) => out.set(v.id, {n:maxManual+i+1, manual:false}));
  return out;
}
function sorted(ranks){
  const vs = [...state.videos], mode = $("sort").value, t = v => new Date(v.posted||0).getTime()||0;
  if (mode === "views") vs.sort((a,b)=>(isNum(b.views)?b.views:-1)-(isNum(a.views)?a.views:-1) || t(b)-t(a));
  else if (mode === "eng") vs.sort((a,b)=>(engRate(b) ?? -1)-(engRate(a) ?? -1) || t(b)-t(a));
  else if (mode === "newest") vs.sort((a,b)=>t(b)-t(a));
  else vs.sort((a,b)=>ranks.get(a.id).n - ranks.get(b.id).n || t(b)-t(a));
  return vs;
}

  return `<article class="col${r1 ? " r1" : ""}" id="v-${esc(v.id)}">
   <div class="cell top"><a class="thumb"${thumbStyle} href="${esc(v.url||"#")}" target="_blank" rel="noopener" aria-label="Watch on TikTok">${v.thumb ? "" : '<span class="ph">🎬</span>'}<div class="chip ${r1 ? "r1" : tone === "good" ? "good" : ""}">#${rk.n}</div>${dur}</a></div>
   <div class="cell"><div class="vtitle" title="${esc(v.caption)}">${esc(title(v.caption))}</div>${ed(v,"product","product","🛍️ + add product")}
     <div class="vlinks">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">Watch on TikTok ↗</a>` : ""}<button class="linkbtn" data-edit="${esc(v.id)}">Edit</button></div></div>
   <div class="cell">${ed(v,"visual","body","What's on screen in the first 2 seconds?")}</div>
   <div class="cell">${ed(v,"vocal","quote","First line you say")}${v.vocalHookNote ? `<div class="after">${noteHtml(v.vocalHookNote)}</div>` : ""}${v.vocalAuto && v.vocal ? '<div class="auto" title="Pulled from TikTok\'s auto-captions (first caption line). Click the text to fix it.">auto from captions</div>' : ""}</div>
   <div class="cell">${ed(v,"text","overlay","On-screen text")}${bar}</div>
   <div class="cell">${ed(v,"cta","body cq","What's your call to action?")}</div>
   <div class="cell"><div class="stats"><div><div class="num">${isNum(v.duration) ? v.duration + "s" : "—"}</div><div class="lbl">length</div></div>
     <div><div class="num">${compact(v.views)}</div><div class="lbl">${recent ? "views so far" : "views"}<br><span title="${esc(fullDate(v.posted))}">${esc(ago(v.posted))}</span></div></div></div>
     <div class="mini"><span><b>${fmt(v.likes)}</b>likes</span><span><b>${fmt(v.comments)}</b>comments</span><span><b>${fmt(v.shares)}</b>shares</span><span><b>${fmt(v.saves)}</b>saves</span><span class="e"><b>${pct(r)}</b>eng.</span></div></div>
   <div class="cell">${ed(v,"hookStyle","tag" + (styleTone ? " " + styleTone : ""),"+ add")}</div>
   <div class="cell">${ed(v,"notes","note","Notes (optional)")}</div>
   <div class="cell bottom"><button class="badge ${r1 ? "r1" : tone}" data-edit="${esc(v.id)}" data-focus="fRank" title="${rk.manual ? "Your rank — click to change" : "Ranked by views among unrated videos — click to set your own rank"}"><span class="bnum">#${rk.n}</span><span class="btxt">${esc(label)}</span></button></div>
  </article>`;
}
function renderGrid(){
  const ranks = computeRanks(), vs = sorted(ranks);
  const g = $("grid");
  g.style.setProperty("--n", Math.max(vs.length, 1));
  const labels = `<div class="labels">${ROWS.map(r => `<div class="lab">${esc(r[1])}</div>`).join("")}</div>`;
  g.innerHTML = labels + (vs.length ? vs.map(v => colHtml(v, ranks.get(v.id))).join("") : `<article class="col"><div class="cell top" style="grid-row:1/-1;color:var(--muted);padding:40px 20px">No videos yet — tap “+ Add video”.</div></article>`);
  const nManual = state.videos.filter(v => isNum(v.rank)).length;
  const modeTxt = {rank:"Ranked by hook strength, strongest on the left", newest:"Newest on the left", views:"Most viewed on the left", eng:"Best engagement on the left"}[$("sort").value];
  $("sub").textContent = `${modeTxt} · ${state.videos.length} videos · stats updated ${SEED_UPDATED_LABEL}`;
  $("footNote").textContent = nManual
    ? `Rank uses your rating when set (${nManual} rated), otherwise views. Click any hook to type; edits save in this browser.`
    : "Rank is based on views until you set your own. Click any hook to type; edits save in this browser.";
  return ranks;
}
function renderSummary(ranks){
  const vs = state.videos;
  $("sCount").textContent = vs.length;
  const dated = vs.map(v=>new Date(v.posted)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  $("sCountH").textContent = dated.length ? shortDate(dated[0]) + " – " + shortDate(dated[dated.length-1]) : " ";
  const wv = vs.filter(v=>isNum(v.views)), tot = wv.reduce((a,v)=>a+v.views,0);
  $("sViews").textContent = wv.length ? compact(tot) : "—";
  $("sViewsH").textContent = wv.length ? "avg " + compact(Math.round(tot/wv.length)) + " per video" : " ";
  const rates = vs.map(engRate).filter(r=>r!=null);
  $("sEng").textContent = rates.length ? pct(rates.reduce((a,b)=>a+b,0)/rates.length) : "—";
  const best = wv.slice().sort((a,b)=>b.views-a.views)[0];
  $("sBest").textContent = best ? compact(best.views) + " views" : "—";
  $("sBestH").innerHTML = best ? `<a href="#v-${esc(best.id)}" data-jump="${esc(best.id)}">${esc(title(best.caption))}</a>` : "&nbsp;";
  const chron = wv.slice().sort((a,b)=>new Date(a.posted||0)-new Date(b.posted||0));
  const max = Math.max(1, ...chron.map(v=>v.views));
  $("bars").innerHTML = chron.map(v => `<button data-jump="${esc(v.id)}" class="${ranks.get(v.id).n===1?"r1":""}" style="height:${Math.max(4, v.views/max*100).toFixed(1)}%" title="${esc(title(v.caption))} · ${fmt(v.views)} views · ${esc(shortDate(v.posted))}" aria-label="${esc(title(v.caption))}"></button>`).join("");
}
function renderAll(){ const r = renderGrid(); renderSummary(r); onScroll(); }

/* ---------- scrolling ---------- */
const sc = $("scroller");
function onScroll(){ sc.classList.toggle("scrolled", sc.scrollLeft > 4); }
sc.addEventListener("scroll", onScroll, {passive:true});
function step(){ const c = document.querySelector(".col"); return c ? c.getBoundingClientRect().width + parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")) : 300; }
$("prev").addEventListener("click", () => sc.scrollBy({left:-step(), behavior:"smooth"}));
$("next").addEventListener("click", () => sc.scrollBy({left:step(), behavior:"smooth"}));
function jumpTo(id){
  const el = document.getElementById("v-" + id); if (!el) return;
  const lab = document.querySelector(".labels").getBoundingClientRect().width;
  sc.scrollTo({left: el.offsetLeft - lab - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")), behavior:"smooth"});
  sc.scrollIntoView({behavior:"smooth", block:"nearest"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
document.addEventListener("click", e => { const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); jumpTo(j.dataset.jump); } });

/* ---------- inline editing ---------- */
const grid = $("grid");
grid.addEventListener("focusout", e => {
  const el = e.target.closest(".ed"); if (!el) return;
  const v = state.videos.find(x => x.id === el.dataset.id); if (!v) return;
  const key = el.dataset.key;
  const val = el.innerText.replace(/\u00a0/g," ").replace(/\s*\n\s*/g," ").trim();
  if (!val) el.innerHTML = "";
  if ((v[key]||"") === val) return;
  v[key] = val; v.touched = v.touched || {}; v.touched[key] = true;
  if (key === "vocal") { v.vocalAuto = false; el.parentElement.querySelector(".auto")?.remove(); }
  if (key === "hookStyle") { el.className = "tag ed" + (val ? " " + (v.hookStyleTone || "neutral") : ""); }
  save(); toast("Saved");
});
grid.addEventListener("keydown", e => {
  const el = e.target.closest(".ed"); if (!el) return;
  if ((e.key === "Enter" && !e.shiftKey) || e.key === "Escape") { e.preventDefault(); el.blur(); }
});
grid.addEventListener("paste", e => {
  if (!e.target.closest(".ed")) return;
  e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
});
grid.addEventListener("click", e => { const b = e.target.closest("[data-edit]"); if (b) { e.preventDefault(); openForm(b.dataset.edit, b.dataset.focus); } });
$("sort").addEventListener("change", () => { try { localStorage.setItem(SORT_KEY, $("sort").value); } catch(e) {} renderAll(); sc.scrollTo({left:0}); });
try { const s = localStorage.getItem(SORT_KEY); if (s && [...$("sort").options].some(o => o.value === s)) $("sort").value = s; } catch(e) {}

/* ---------- modal ---------- */
let editing = null;
const TXT = {url:"fUrl", caption:"fCap", product:"fProduct", visual:"fVisual", vocal:"fVocal", vocalHookNote:"fVocalNote", text:"fText", cta:"fCta", hookStyle:"fStyle", hookStyleTone:"fTone", rankLabel:"fRankLabel", notes:"fNotes"};
const NUM = {duration:"fDur", views:"fViews", likes:"fLikes", comments:"fComments", shares:"fShares", saves:"fSaves", textHookSeconds:"fTextSec", rank:"fRank"};
function openForm(id, focus){
  editing = id ? state.videos.find(v => v.id === id) : null;
  $("formTitle").textContent = editing ? "Edit video" : "Add video";
  $("delBtn").style.visibility = editing ? "visible" : "hidden";
  for (const [k, f] of Object.entries({...TXT, ...NUM})) $(f).value = editing && editing[k] != null ? editing[k] : "";
  $("fDate").value = editing ? toLocalInput(editing.posted) : "";
  $("overlay").classList.add("open");
  setTimeout(() => $(focus || (editing ? "fViews" : "fUrl")).focus(), 30);
}
function closeForm(){ $("overlay").classList.remove("open"); editing = null; }
$("addBtn").addEventListener("click", () => openForm(null));
$("cancelBtn").addEventListener("click", closeForm);
$("overlay").addEventListener("mousedown", e => { if (e.target === $("overlay")) closeForm(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("open")) closeForm(); });
$("fUrl").addEventListener("input", () => { const id = idFromUrl($("fUrl").value); if (id && !$("fDate").value) { const iso = dateFromId(id); if (iso) $("fDate").value = toLocalInput(iso); } });
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const vals = {};
  for (const [k, f] of Object.entries(TXT)) vals[k] = $(f).value.trim();
  for (const [k, f] of Object.entries(NUM)) { const s = $(f).value.trim(); const n = Number(s); vals[k] = s === "" || !isFinite(n) ? null : n; }
  vals.posted = fromLocalInput($("fDate").value);
  if (!vals.url && !vals.caption) { toast("Add a URL or caption first"); $("fUrl").focus(); return; }
  if (editing) {
    if ([...STAT_KEYS, ...META_KEYS].some(k => (editing[k] ?? "") !== (vals[k] ?? ""))) editing.statsEdited = true;
    editing.touched = editing.touched || {};
    for (const k of HOOK_KEYS) if ((editing[k] ?? "") !== (vals[k] ?? "")) { editing.touched[k] = true; if (k === "vocal") editing.vocalAuto = false; }
    Object.assign(editing, vals);
    toast("Video updated");
  } else {
    const id = idFromUrl(vals.url) || ("manual-" + Date.now());
    if (state.videos.some(v => v.id === id)) { toast("That video is already in your tracker"); return; }
    const v = Object.assign(blank(id), vals); HOOK_KEYS.forEach(k => { if (vals[k] !== "" && vals[k] != null) v.touched[k] = true; });
    state.videos.push(v); state.deleted = (state.deleted||[]).filter(x => x !== id);
    toast("Video added");
  }
  save(); closeForm(); renderAll();
});
$("delBtn").addEventListener("click", () => {
  if (!editing || !confirm("Remove this video from your tracker?")) return;
  state.videos = state.videos.filter(v => v !== editing);
  state.deleted = [...new Set([...(state.deleted||[]), editing.id])];
  save(); closeForm(); renderAll(); toast("Removed");
});

/* ---------- CSV ---------- */
const COLS = [["id","id"],["url","url"],["posted_pt","posted"],["caption","caption"],["product","product"],["duration_sec","duration"],["views","views"],["likes","likes"],["comments","comments"],["shares","shares"],["saves","saves"],["engagement_pct",null],
  ["visual_hook","visual"],["vocal_hook","vocal"],["vocal_hook_note","vocalHookNote"],["text_hook","text"],["text_hook_seconds","textHookSeconds"],["cta","cta"],["hook_style","hookStyle"],["hook_style_tone","hookStyleTone"],["rank","rank"],["rank_label","rankLabel"],["notes","notes"]];
const NUMERIC = new Set(["duration","views","likes","comments","shares","saves","textHookSeconds","rank"]);
const csvCell = v => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
function exportCSV(){
  const ranks = computeRanks(), rows = [COLS.map(c=>c[0]).join(",")];
  for (const v of sorted(ranks)) rows.push(COLS.map(([c,k]) => {
    if (c === "engagement_pct") { const r = engRate(v); return r == null ? "" : (r*100).toFixed(2); }
    if (c === "posted_pt") return toLocalInput(v.posted).replace("T"," ");
    return v[k];
  }).map(csvCell).join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "marksvibez-hooks-" + toLocalInput(new Date().toISOString()).slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV exported");
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function importCSV(text){
  const rows = parseCSV(text); if (rows.length < 2) { toast("No rows found in that CSV"); return; }
  const head = rows[0].map(h => h.trim().toLowerCase());
  const get = (r, name) => { const i = head.indexOf(name); return i < 0 ? undefined : (r[i] ?? "").trim(); };
  let added = 0, updated = 0;
  for (const r of rows.slice(1)) {
    const url = get(r,"url") || "";
    const id = get(r,"id") || idFromUrl(url) || ("manual-" + Date.now() + "-" + Math.random().toString(36).slice(2,6));
    let v = state.videos.find(x => x.id === id); const isNew = !v;
    if (isNew) { v = blank(id); state.videos.push(v); }
    v.touched = v.touched || {};
    for (const [c, k] of COLS) {
      if (!k || k === "id") continue;
      let s = get(r, c); if (s === undefined) continue;
      let val;
      if (k === "posted") val = s ? fromLocalInput(s.replace(" ","T").slice(0,16)) : (isNew ? dateFromId(id) || "" : v.posted);
      else if (NUMERIC.has(k)) { const n = Number(s.replace(/,/g,"")); val = s === "" || !isFinite(n) ? null : n; }
      else val = s;
      if (k === "url" && !val && v.url) continue;
      if ((v[k] ?? "") === (val ?? "")) continue;
      if (k === "posted" && v.posted && val && Math.abs(new Date(v.posted) - new Date(val)) < 60000) continue;
      v[k] = val;
      if (!isNew && HOOK_KEYS.includes(k)) { v.touched[k] = true; if (k === "vocal") v.vocalAuto = false; }
      if (!isNew && (STAT_KEYS.includes(k) || META_KEYS.includes(k))) v.statsEdited = true;
    }
    state.deleted = (state.deleted||[]).filter(x => x !== id);
    isNew ? added++ : updated++;
  }
  save(); renderAll(); toast(`Imported: ${added} new, ${updated} updated`);
}
$("exportBtn").addEventListener("click", exportCSV);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { importCSV(String(rd.result)); e.target.value = ""; }; rd.readAsText(f); });

renderAll();
</script>
</body>
</html>
